<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #4F46E5; color: white; padding: 20px; text-align: center; }
    .content { background: #f9f9f9; padding: 20px; margin-top: 20px; }
    .button { display: inline-block; padding: 12px 24px; background: #4F46E5; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
    .footer { text-align: center; margin-top: 20px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Students Platform</h1>
    </div>
    <div class="content">
      <h2>{{subject}}</h2>
      <p><strong>{{actorName}}</strong> {{action}} {{targetDescription}}</p>
      <p>{{message}}</p>
      <a href="{{actionUrl}}" class="button">View Now</a>
    </div>
    <div class="footer">
      <p>You received this email because you are a member of Students Platform</p>
      <p>To manage your notification preferences, visit your settings</p>
    </div>
  </div>
</body>
</html>
