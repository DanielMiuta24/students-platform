<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #FFFFFF; color: #0F2A5F; padding: 28px 20px; text-align: center; border-radius: 12px 12px 0 0; border: 2px solid #0F2A5F; }
    .content { background: #f9fafb; padding: 32px 24px; border: 1px solid #e5e7eb; border-top: none; }
    .field { margin-bottom: 16px; }
    .field-label { font-size: 12px; font-weight: bold; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .field-value { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 14px; color: #111827; }
    .description-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px; white-space: pre-wrap; color: #111827; margin-top: 4px; }
    .priority-high { color: #dc2626; font-weight: bold; }
    .priority-medium { color: #d97706; font-weight: bold; }
    .priority-low { color: #16a34a; font-weight: bold; }
    .footer { text-align: center; margin-top: 20px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="cid:isc-logo" alt="International Student Compass" style="height:240px;width:auto;display:block;margin:0 auto 10px;" />
    </div>
    <div class="content">
      <h2 style="color:#0F2A5F;margin-top:0;">New Support Request</h2>
      <div class="field">
        <div class="field-label">Subject</div>
        <div class="field-value">{{subject}}</div>
      </div>
      <div class="field">
        <div class="field-label">Type</div>
        <div class="field-value">{{problemType}}</div>
      </div>
      <div class="field">
        <div class="field-label">Priority</div>
        <div class="field-value">{{priority}}</div>
      </div>
      <div class="field">
        <div class="field-label">From</div>
        <div class="field-value"><a href="mailto:{{email}}" style="color:#2563EB;">{{email}}</a></div>
      </div>
      <div class="field">
        <div class="field-label">Description</div>
        <div class="description-box">{{description}}</div>
      </div>
    </div>
    <div class="footer">
      <p>International Student Compass &mdash; Your study abroad companion</p>
    </div>
  </div>
</body>
</html>
