version: "3.9"
services:
  api:
    build:
      context: ./backend
      target: prod
    ports: ["3000:3000"]
    restart: unless-stopped
    env_file: ./backend/.env

  web:
    build:
      context: ./frontend
      target: prod
    ports: ["8080:80"]
    restart: unless-stopped
    depends_on:
      - api
